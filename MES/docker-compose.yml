version: "3.8"

services:
  # 1. Database (The Digital Thread)
  db:
    image: postgres:15-alpine
    container_name: englabs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mes_admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: mes_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mes_admin -d mes_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend API (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: englabs_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mes_admin:secure_password@db/mes_db
      HP_CLIENT_ID: akaqtcgj93enbvl5sivui55f9cg208in
      HP_CLIENT_SECRET: cfrkv2hiv96sv4lb130vbb2du520tk32
      OPENAI_API_KEY: "" # Add your OpenAI API Key here
      GEMINI_API_KEY: "AIzaSyAQib5iRpK6u01A6XpIpju9q8dBEC2RaEk" # Add your Gemini API Key here
    ports:
      - "8008:8000"
    volumes:
      - ./src:/app/src
      - ./storage:/app/storage

  # 4. CAD Converter Sidecar (For FreeCAD)
  converter:
    build:
      context: ./src/converter
      dockerfile: Dockerfile
    container_name: englabs_converter
    restart: unless-stopped
    ports:
      - "5000" # Internal only, usually
    volumes:
      # Mount converter source code to allow hot-reloading if we ran with --reload, 
      # but main.py is copied in Dockerfile. We mount to allow easy edits.
      - ./src/converter:/app

  # 3. Frontend (Node/Vite)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: englabs_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8008
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
